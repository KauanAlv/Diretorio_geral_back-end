  # ESTRUTURA DE CADA TABELA:
components:
  schemas:
    Atividade:
      required:
      - id
      - area_atuacao
      type: object
      properties:
        id:
          type: integer
        area_atuacao:
          type: string
          example: "Roteirista"
          description: O número máximo de caracteres é de 40.

    Classificacao:
      required:
      - id
      - classificacao
      type: object
      properties:
        id:
          type: integer
        classificacao:
          type: string
          example: "+14"
          description: "O número máximo de caracteres é de 5, caso seja livre, guarde a letra L"
        descricao:
          type: string
          description: O número máximo de caracteres é ilimitado.
        idade_minima:
          type: integer

    Filme:
      required:
        - id
        - nome
        - sinopse
        - capa
        - data_lancamento
        - duracao
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          description: O número máximo de caracteres é 80.
        sinopse:
          type: string
          description: O número máximo de caracteres é ilimitado.
        capa:
          type: string
          description: O número máximo de caracteres é 255.
        data_lancamento:
          type: string
          format: date
          example: "2026-01-01"
        duracao:
          type: string
          example: "02:30"
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        valor:
          type: number
          format: double
          example: "999.99"
          description: O número máximo de caracteres é de 9 centenas, 9 dezenas e 9 unidades (999) e 2 casas decimais (.99).
        avaliacao:
          type: number
          format: double
          example: "5.0"
          description: O número máximo de caracteres é de 5 unidade (5) e 1 casa decimal (.9), porém tendo como valor máximo 5.0.

    Foto:
      required: 
        - id
        - foto
      type: object
      properties:
        id:
          type: integer
        foto:
          type: string
          description: O número máximo de caracteres é de 255.

    Genero:
      required:
        - id
        - genero
      type: object
      properties:
        id:
          type: integer
        genero:
          type: string
          example: "Comédia"
          description: O número máximo de caracteres é de 30.

    Nacionalidade:
      required:
        - id
        - nacionalidade
      type: object
      properties:
        id:
          type: integer
        nacionalidade:
          type: string
