openapi: 3.0.3
info:
  title: Projeto Controle de Filmes - SENAI Jandira
  description: |-
   API destinada ao controle de filmes para o projeto do senai
  termsOfService: http://swagger.io/terms/
  contact:
    email: kauan0alvess@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.4.26
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://
paths:
# ENDPOINTS - ATIVIDADE
  /v1/senai/locadora/atividade:
    post:
      tags:
        - Atividade
      summary: Adiciona uma nova atividade
      description: Endpoint para enviar os dados da atividade profissional a serem cadastrados
      requestBody:
        description: JSON contendo os dados da nova atividade profissional a ser inserida no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Atividade'
        required: true
      responses:
        '201':
          description: Success Created Item
        '400':
          description: Error Bad Request
        '415':
          description: Error Content-Type
        '500':
          description: Error Internal Server (Controller / Model)
    get:
      tags:
        - Atividade
      summary: Lista todas as atividades profissionais
      description: Listagem de todas as atividades profissionais registradas no sistema
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Atividade'              
        '404':
          description: Error Not Found
        '500':
          description: Error Interal Server (Controller / Model)
  /v1/senai/locadora/atividade/{id}:
    get:
        tags:
          - Atividade
        summary: Busca uma atividade profissional pelo ID
        description: Retorna uma atividade profissional pelo ID
        parameters:
          - name: id
            in: path
            description: ID para realizar a busca da atividade profissional
            required: true
            schema:
              type: integer
              format: int64
        responses:
          '200':
            description: Success Response
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Atividade'          
          '400':
            description: Error Bad Request
          '404':
            description: Error Not Found
          '500':
            description: Error Internal Server (Controller / Model)
    put:

      tags:
        - Atividade
      summary: Atualizar uma atividade profissinal pelo ID
      description: Buscar e atualizar uma atividade profissinal pelo ID
      parameters:
        - name: id
          in: path
          description: ID para realizar a busca da Atividade Profissinal
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar uma Atividade Profissinal
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Atividade'
        required: true
      responses:
        '200':
          description: Success Updated Item
        '400':
          description: Error Bad Request
        '404':
          description: Error Not Found
        '415':
          description: Error Content Type
        '500':
          description: Error Internal Server (Controller / Model)
    delete:
      tags:
        - Atividade
      summary: Excluir uma Atividade Profissional pelo ID
      description: Buscar e excluir uma Atividade Profissional pelo ID
      parameters:
        - name: id
          in: path
          description: ID para buscar a Atividade Profissional.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success Deleted Item
        '400':
          description: Error Bad Request 
        '404':
          description: Error Not Found
        '500':
          description: Error Internal Server (Controller / Model)

# ENDPOINTS - FILME
  /v1/senai/locadora/filme:
    post:
      tags:
        - Filme
      summary: Adiciona um novo filme
      description: Endpoint para enviar os dados do filme a serem cadastrados
      requestBody:
        description: JSON contendo os dados do novo filme a ser inserido no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '201':
          description: Success Created Item
        '400':
          description: Error Bad Request
        '415':
          description: Error Content Type
        '500':
          description: Error Internal Server (Controller / Model)
    get:
      tags:
        - Filme
      summary: Lista todos os filmes
      description: Listagem de todos os filmes registrados no sistema
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Filme'          
        '404':
          description: Error Not Found
        '500':
          description: Error Interal Server (Controller / Model)
  /v1/senai/locadora/filme/{id}:
    get:
      tags:
        - Filme
      summary: Busca um filme pelo ID
      description: Retorna um filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID para realizar a busca do filme
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filme'          
        '400':
          description: Error Bad Request
        '404':
          description: Error Not Found
        '500':
          description: Error Internal Server (Controller / Model)
    put:
      tags:
        - Filme
      summary: Atualizar um filme pelo ID
      description: Buscar e atualizar um filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID para realizar a busca do Filme
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar um filme
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '200':
          description: Success Updated Item
        '400':
          description: Error Bad Request
        '404':
          description: Error Not Found
        '415':
          description: Error Content-Type
        '500':
          description: Error Internal Server (Controller / Model)
    delete:
      tags:
        - Filme
      summary: Excluir um Filme pelo ID
      description: Buscar e excluir um filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID para buscar o filme
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success Deleted Item
        '400':
          description: Error Bad Request
        '404':
          description: Error Not Found
        '500':
          description: Error Internal Server (Controller / Model)

components:
  schemas:
    Atividade:
      required:
      - area_atuacao
      type: object
      properties:
        id:
          type: integer
        area_atuacao:
          type: string
          example: "Roteirista"
          description: O número máximo de caracteres é de 40.

    Classificacao:
      required:
      - classificacao
      type: object
      properties:
        id:
          type: integer
        classificacao:
          type: string
          example: "+14"
          description: "O número máximo de caracteres é de 5, caso seja livre, guarde a letra L"
        descricao:
          type: string
          description: O número máximo de caracteres é ilimitado.
        idade_minima:
          type: integer

    Filme:
      required:
        - nome
        - sinopse
        - capa
        - data_lancamento
        - duracao
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          description: O número máximo de caracteres é 80.
        sinopse:
          type: string
          description: O número máximo de caracteres é ilimitado.
        capa:
          type: string
          description: O número máximo de caracteres é 255.
        data_lancamento:
          type: string
          format: date
          example: "2026-01-01"
        duracao:
          type: string
          example: "02:30"
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        valor:
          type: number
          format: double
          example: "999.99"
          description: O número máximo de caracteres é de 9 centenas, 9 dezenas e 9 unidades (999) e 2 casas decimais (.99).
        avaliacao:
          type: number
          format: double
          example: "5.0"
          description: O número máximo de caracteres é de 5 unidade (5) e 1 casa decimal (.9), porém tendo como valor máximo 5.0.

    Foto:
      required: 
        - foto
      type: object
      properties:
        id:
          type: integer
        foto:
          type: string
          description: O número máximo de caracteres é de 255.

    Genro:
      required:
        - genero
      type: object
      properties:
        id:
          type: integer
        genero:
          type: string
          example: "Comédia"
          description: O número máximo de caracteres é de 30.

    Nacionalidade:
      required:
        - nacionalidade
      type: object
      properties:
        id:
          type: integer
        nacionalidade:
          type: string
          example: "Brasileiro"
          description: O número máximo de caraceteres é de 25.
    
    Sexo:
      required:
        - sigla
        - sexo
      type: object
      properties:
        id:
          type: integer
        sigla:
          type: string
          example: "M"
          description: O número máximo de caracteres é de 3.
        sexo:
          type: string
          example: "Masculino"
          description: O número máximo de caracteres é de 15.

  requestBodies:
    Atividade:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Atividade'

    Classificacao:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
          $ref: '#/components/schemas/Classificacao'

    Filme:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Filme'
  
    Foto:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Foto'

    Genero:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Genero'
    
    Nacionalidade:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Nacionalidade'
    
    Sexo:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Sexo'